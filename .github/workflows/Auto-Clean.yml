name: Auto-Clean

on:
  # 自动清理：每天 05:00 (CST) 在自动构建前执行，默认清理所有 Releases 及孤立 Tag
  schedule:
    - cron: 0 21 * * *
  # 手动清理（默认同样清理所有 Releases 及孤立 Tag）
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete old Releases and Workflows
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          # 0 = 默认清理所有 Releases（不保留最新）
          releases_keep_latest: 0
          # 清理 Release 时一并删除其关联 Tag
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 30

      - name: Delete orphaned Tags
        # node24：actions/github-script@v7 运行在 Node 20 上
        uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const { owner, repo } = context.repo;
            // 列出仓库内所有 Tag（分页）
            let tags = [];
            let page = 1;
            while (true) {
              const res = await github.rest.repos.listTags({ owner, repo, per_page: 100, page });
              if (res.data.length === 0) break;
              tags = tags.concat(res.data);
              page++;
            }
            core.info(`Found ${tags.length} tag(s). Deleting all remaining (orphaned) tags...`);
            for (const t of tags) {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${t.name}` });
              core.info(`Deleted tag: ${t.name}`);
            }
            if (tags.length === 0) core.info('No tags to delete.');
