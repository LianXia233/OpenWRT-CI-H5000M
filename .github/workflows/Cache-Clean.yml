name: Cache-Clean

on:
  #自动清理：每周一早上4点
  schedule:
    - cron: 0 20 * * 0
  #手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Projects
        # node24：actions/checkout@v4 仍运行在已弃用的 Node 20 上
        uses: actions/checkout@v7

      - name: Cache Clean
        run: gh cache delete --all
