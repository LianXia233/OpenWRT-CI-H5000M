name: Cache-Clean

on:
  #自动清理：每周一早上4点
  schedule:
    - cron: 0 20 * * 0
  #手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Projects
        # node24：actions/checkout@v4 仍运行在已弃用的 Node 20 上
        uses: actions/checkout@v7

      - name: Cache Clean
        run: |
          # 只清理同一缓存前缀下的旧条目，始终保留每个前缀最新的一份。
          # 此前 `gh cache delete --all` 会在每周清理后把次日构建变成冷编译，
          # 冷编译实测 4 小时以上，极易触发 300 分钟编译预算超时（exit 124）。
          # 未被使用的缓存 GitHub 会在 7 天后自动回收，无需整库清空。
          # 对于 rust-* 缓存，其 key 结构为 rust-<lock_hash>-<rustc_rel>，
          # 需统一归入 rust 前缀以正确保留最新一份并清理历史失效条目。
          ids=$(gh cache list --limit 100 --json id,key,createdAt \
            --jq 'def group_prefix: if .key | startswith("rust-") then "rust" else (.key | sub("-[^-]+$"; "")) end;
                  sort_by(group_prefix, .createdAt)
                  | group_by(group_prefix)
                  | map(.[0:-1]) | add // []
                  | .[].id')
          if [ -z "$ids" ]; then
            echo "没有需要清理的旧缓存，保留现有最新缓存用于增量编译。"
            exit 0
          fi
          for id in $ids; do
            echo "删除旧缓存：$id"
            gh cache delete "$id"
          done
