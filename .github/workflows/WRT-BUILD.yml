# CI 项目
name: WRT-BUILD

# CI 计划
on:
  # 手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        description: '编译配置'
        default: 'MEDIATEK-WIFI-YES'
        required: true
        type: choice
        options:
          - MEDIATEK-WIFI-YES
      SOURCE:
        description: '源码仓库'
        default: 'VIKINGYFY/immortalwrt'
        required: true
        type: choice
        options:
          - VIKINGYFY/immortalwrt
          - immortalwrt/immortalwrt
      BRANCH:
        description: '源码分支（VIKINGYFY 用 owrt，immortalwrt 用 master）'
        default: 'owrt'
        required: true
        type: string
      MODEM:
        description: 'MT5700M 模组管理插件（两者独占 AT 串口，只能二选一）'
        default: 'MT5700'
        required: true
        type: choice
        options:
          - MT5700
          - MT5700M
      PACKAGE:
        description: '手动调整插件包，多个请用换行隔开'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件'
        default: false
        required: true
        type: boolean

# CI 权限
permissions: write-all

# CI 任务
jobs:
  config:
    name: ${{ inputs.CONFIG }}
    # 调用公用编译核心 WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      # 编译配置
      WRT_CONFIG: ${{ inputs.CONFIG }}
      # 默认主题
      WRT_THEME: aurora
      # 默认主机名
      WRT_NAME: OWRT
      # 默认 WIFI 名称
      WRT_SSID: OWRT
      # 默认 WIFI 密码
      WRT_WORD: 12345678
      # 默认地址
      WRT_IP: 192.168.10.1
      # 默认密码，仅作提示，修改无用
      WRT_PW: 无
      # 源码链接
      WRT_REPO: https://github.com/${{ inputs.SOURCE }}.git
      # 源码分支
      WRT_BRANCH: ${{ inputs.BRANCH }}
      # 源码名称
      WRT_SOURCE: ${{ inputs.SOURCE }}
      # 模组插件二选一
      WRT_MODEM: ${{ inputs.MODEM }}
      # 插件调整
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      # 仅输出配置文件
      WRT_TEST: ${{ inputs.TEST }}
