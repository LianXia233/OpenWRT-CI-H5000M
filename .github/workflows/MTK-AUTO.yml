name: MTK-AUTO

on:
  # 每天随 Auto-Clean 完成后自动触发
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  # 也可手动触发
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用换行隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }} · ${{ matrix.MODEM }}
    strategy:
      fail-fast: false
      matrix:
        # H5000M 专用：仅编译 MEDIATEK-WIFI-YES
        CONFIG: [MEDIATEK-WIFI-YES]
        # 两套插件独占同一 AT 串口，不能塞进同一份 .config。
        # 故每次构建固定拆成两个作业：各编一套固件、各发一个 Release，
        # 无需在触发时做选择；一套失败（fail-fast: false）也不影响另一套。
        MODEM: [MT5700, MT5700M]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      # 默认主题（vantage；aurora 仍编入固件，可在系统设置里切回）
      WRT_THEME: vantage
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_MODEM: ${{ matrix.MODEM }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}
