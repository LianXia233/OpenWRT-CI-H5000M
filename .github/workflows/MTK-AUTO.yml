name: MTK-AUTO

on:
  # 每天随 Auto-Clean 完成后自动触发
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  # 也可手动触发
  workflow_dispatch:
    inputs:
      MODEM:
        description: 'MT5700M 模组管理插件（两者独占 AT 串口，只能二选一）。'
        default: 'MT5700'
        required: false
        type: choice
        options:
          - MT5700
          - MT5700M
      PACKAGE:
        description: '手动调整插件包，多个请用换行隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}
    strategy:
      fail-fast: false
      matrix:
        # H5000M 专用：仅编译 MEDIATEK-WIFI-YES
        CONFIG: [MEDIATEK-WIFI-YES]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.10.1
      WRT_PW: 无

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_MODEM: ${{ inputs.MODEM }}
      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}
