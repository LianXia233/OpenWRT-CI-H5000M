# 云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string
      WRT_MODEM:
        # 本次编译使用的模组插件：MT5700 = LianXia233/luci-app-mt5700，
        # MT5700M = FAN789/luci-app-mt5700m。两者独占同一 AT 串口，
        # 故每个固件只能启用其中一个；调用方以矩阵方式各编一套
        # （见 MTK-AUTO / WRT-BUILD），此处为单次构建的入参。
        required: false
        type: string
        default: MT5700

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  # 未传入（如定时构建）时默认新插件
  WRT_MODEM: ${{inputs.WRT_MODEM || 'MT5700'}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}} · ${{inputs.WRT_MODEM || 'MT5700'}}
    # 固定 runner 镜像：ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26.04，
    # 而 immortalwrt 初始化脚本与部分 host 依赖尚未适配，迁移会造成编译中断。
    # 固定到 ubuntu-24.04 保证可复现构建（需更新镜像时只需改这一处）。
    runs-on: ubuntu-24.04
    # 兜底上限：缓存命中时正常构建约 40 分钟。2026-11-06 事故中 apt 下载退化把 job 拖到
    # 2.5 小时，最终 runner 被环境回收、日志也没能上传（job 日志端点返回 404），只能靠猜。
    # 显式收束可让异常在可观测的时间窗内以失败告终，并保留日志。
    #
    # 2026-11-09 run 130：Cache-Clean 周日清空全部缓存后，两个作业都是冷编译，
    # 4 核 runner 上 3.5 小时仍没编完（详见 Compile Firmware 注释）。冷编译不是异常，
    # 是每周必然出现一次的正常路径，300 分钟的 job 上限不足以覆盖它 → 提高到
    # GitHub 允许的上限 360 分钟，并把编译步骤的总预算按 300 分钟分配。
    timeout-minutes: 360
    steps:
      - name: Checkout Projects
        # node24：actions/checkout@v4 仍运行在已弃用的 Node 20 上
        uses: actions/checkout@v7

      - name: Free Up Disk Space
        # GitHub ubuntu-latest runner 根盘预装 dotnet/android-sdk/ghc 等占用约 25GB，
        # filogic 全量编译 + ccache 需要 30GB 以上，先清理与编译无关的预装件。
        # 这些目录不影响 apt 与构建工具链，runner 为一次性环境，删除安全。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / /mnt 2>/dev/null || true

      - name: Select Apt Mirror
        # runner 镜像内置 /etc/apt/apt-mirrors.txt：azure.archive.ubuntu.com(priority:1) →
        # archive.ubuntu.com(priority:2) → security.ubuntu.com(priority:3)。apt 只按优先级
        # 取第一个可用镜像，慢但没报错时不会自动降级。2026-11-06 事故就是 azure 镜像吞吐
        # 骤降到几十 kB/s，上游 init_build_environment.sh 需要下载约 661 MB 依赖，
        # 步骤被拖到 1.5~2.5 小时直至 runner 失联、日志未上传。
        # 这里按实测吞吐在两者之间切换；吞吐正常时不改变任何现有配置。
        timeout-minutes: 5
        run: |
          # 测速必须带真实体积：原来探的是 1.76 MB 的 noble-updates/main/Packages.gz，
          # 小文件测的是连接建立而不是持续吞吐。本仓库 run 124 的实测输出：
          #   apt 镜像实测吞吐（字节/秒）：azure=45627172 archive=1045578
          # 探测把 azure 判成快 44 倍、正确地保留默认；而几分钟后同一个 azure 下
          # bulk .deb 只有约 50 kB/s（texlive-binaries 8.5 MB 走掉 3 分钟）。
          # 小文件探测不只是测不出退化，它会主动把慢镜像选进来。
          # 改用 universe 的 Packages.xz（15.0 MB，apt 自己就要下载），配合 Range
          # 只取前 8 MB：50 kB/s 时 8 MB 要 160 秒，必然超过 --max-time 而现形。
          probe() {
            local sp
            sp=$(curl -sSL -r 0-8388607 -o /dev/null --connect-timeout 10 --max-time 25 \
              -w '%{speed_download}' "$1" 2>/dev/null || true)
            echo "${sp:-0}" | cut -d. -f1
          }
          # 代号取自 runner 镜像：runner 升级后若目标 404，两边都测到 0，判定退回
          # 「保持默认」，属安全降级而非误切换。
          . /etc/os-release 2>/dev/null || true
          IDX="dists/${VERSION_CODENAME:-noble}/universe/binary-amd64/Packages.xz"
          AZ=$(probe "http://azure.archive.ubuntu.com/ubuntu/${IDX}")
          ALT=$(probe "https://archive.ubuntu.com/ubuntu/${IDX}")
          AZ=${AZ:-0}
          ALT=${ALT:-0}
          echo "apt 批量吞吐实测（字节/秒）：azure=${AZ} archive=${ALT}"

          # 判定：azure 低于 300 kB/s 视为退化，且备用镜像至少快一倍、自身也达到 300 kB/s
          # 才切换，避免在两边都慢时把配置改坏。
          if [ "$AZ" -lt 300000 ] && [ "$ALT" -ge $((AZ * 2)) ] && [ "$ALT" -ge 300000 ]; then
            echo "azure 镜像吞吐低于阈值，切换为 archive.ubuntu.com 优先"
            printf '%s\t%s\n' \
              'https://archive.ubuntu.com/ubuntu/' 'priority:1' \
              'https://security.ubuntu.com/ubuntu/' 'priority:2' \
              'http://azure.archive.ubuntu.com/ubuntu/' 'priority:3' \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            # 兼容未走 mirrorlist 的镜像：sources 里若硬编码 azure 也一并替换
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            # 换了源必须重新取索引，否则本步骤之后的 apt 仍按旧镜像的索引解析依赖
            sudo -E apt -yqq update
          else
            echo "镜像吞吐正常，保持 runner 默认镜像配置"
          fi

      - name: Initialization Environment
        # 正常 5~6 分钟。上限 60 分钟：今天这种上游退化必须尽快失败并留下日志，
        # 而不是像以前那样烧掉 1.5~2.5 小时后连日志都取不到。
        timeout-minutes: 60
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt 全局超时配置：覆盖本步骤及 init_build_environment.sh 内部 apt 调用，
          # 避免偶发网络挂起导致 job 6 小时超时取消
          sudo tee /etc/apt/apt.conf.d/99marvis-timeouts >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          Acquire::ftp::Timeout "60";
          DPkg::Lock::Timeout "120";
          Dpkg::Use-Pty "0";
          EOF
          # apt 命令超时重试封装
          # 用法：apt_retry <超时秒数> <apt 子命令及参数...>
          # 不同命令耗时差异很大（full-upgrade 在 runner 镜像更新后可能要下载数百 MB），
          # 统一 300 秒会把正常的慢速下载误杀，故超时时间改为按命令传入。
          #
          # 关键：`timeout` 必须是 `sudo` 的子进程（sudo 在前），不能写成
          # `timeout ... sudo apt`。后者超时时只把信号发给 sudo 所在的进程组，
          # sudo 被 SIGKILL 后无法再转发信号，它拉起的 apt 会成孤儿继续跑并持有
          # /var/lib/dpkg/lock-frontend —— 于是后续每一次重试都卡在锁上，
          # 2026-11-06 的 MT5700M job 就是这样连续 3 轮、空烧 30 分钟后 exit 1。
          # sudo 在前时 timeout 与 apt 同组，SIGTERM/SIGKILL 直接命中 apt。
          apt_retry() {
            local tmo="$1"; shift
            local i
            for i in 1 2 3; do
              sudo -E timeout --kill-after=30 "$tmo" apt -yqq \
                -o Dpkg::Options::=--force-confdef \
                -o Dpkg::Options::=--force-confold "$@" && return 0
              echo "apt $* 第 ${i} 次失败或超时（${tmo}s）" >&2
              # 留下持锁者，下次再出问题时不必猜是谁卡住了 dpkg
              pgrep -a apt || true
              sleep 10
            done
            return 1
          }
          apt_retry 300 purge firefox
          apt_retry 300 update
          # 主机系统升级不是编译必需项：慢网络下允许更长耗时，失败也不阻塞后续流程，
          # 只需修复可能被中断的 dpkg 状态即可。单次上限从 1800s 收到 600s：
          # 有镜像切换兜底后，3 次重试最多 30 分钟，不再把整步骤的时间预算吃光。
          if ! apt_retry 600 full-upgrade; then
            echo "系统升级失败或超时，修复 dpkg 状态后继续" >&2
            sudo -E dpkg --configure -a || true
            sudo -E apt -yqq -f install || true
          fi
          apt_retry 300 autoremove --purge
          apt_retry 300 autoclean
          apt_retry 300 clean
          apt_retry 900 install dos2unix libfuse-dev gettext
          # 官方初始化脚本同样加超时与重试（脚本内部有 apt update 步骤）。
          # 单次上限 900s（正常 5 分钟，3 倍余量）：3 次全部超时也才 45 分钟，
          # 仍在步骤 60 分钟上限之内，能带着日志失败而不是被环境回收。
          #
          # 先落盘再执行，不再用 `bash <(curl ...)`：curl 卡住或证书失败时，进程
          # 替换喂给 bash 的是空内容，bash 会以 0 退出，这一步反而「成功」，
          # 缺依赖要到几小时后的编译阶段才暴露。落盘后能校验字节数并对下载本身设超时。
          INIT_OK=0
          for i in 1 2 3; do
            if [ ! -s /tmp/init_build_environment.sh ]; then
              if ! curl -fsSL --retry 3 --connect-timeout 30 --max-time 120 \
                -o /tmp/init_build_environment.sh \
                https://build-scripts.immortalwrt.org/init_build_environment.sh; then
                echo "init_build_environment.sh 下载失败（第 ${i} 次）" >&2
                rm -f /tmp/init_build_environment.sh
                sleep 10
                continue
              fi
              wc -c /tmp/init_build_environment.sh
            fi
            # sudo 在前，让 timeout 与脚本拉起的 apt 同属一个进程组（原因见 apt_retry 注释）
            if sudo -E timeout --kill-after=30 900 bash /tmp/init_build_environment.sh; then
              INIT_OK=1
              break
            fi
            echo "init_build_environment 第 ${i} 次失败或超时" >&2
            pgrep -a apt || true
            sleep 10
          done
          if [ "$INIT_OK" != "1" ]; then
            echo "init_build_environment 连续失败，终止以避免后续编译无谓耗时" >&2
            exit 1
          fi
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          # 记录 job 起始时间：Compile Firmware 用它把编译预算收敛到 job 上限之内
          # （前置步骤变慢时自动少给编译时间，而不是跑满预算后撞上 360 分钟被强杀）。
          echo "JOB_START_EPOCH=$(date +%s)" >> $GITHUB_ENV
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        # node24：actions/cache@v4 仍运行在已弃用的 Node 20 上
        uses: actions/cache@v6
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if [ "${{ steps.check-cache.outputs.cache-hit }}" != 'true' ]; then
            CACHE_LIST=$(gh cache list --json id --key "$WRT_CONFIG-$WRT_INFO" --jq '.[].id' 2>/dev/null)
            for CACHE_ID in $CACHE_LIST; do
              gh cache delete "$CACHE_ID"
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2026-10-17 修复：immortalwrt/packages 合并官方源（dd29469e22）后
          # miniupnpd 升级到 2.3.11，feed 自带的 020-descr-filter-fix.patch
          # 针对的是旧版解析器，其全部改动（upnppermissions.c 解析器重写、
          # upnppermissions.h 的 const char * 签名）已被 2.3.11 上游吸收，
          # 继续打补丁会因 7 个 hunk 中 5 个失败而中断所有平台的编译。
          # 删除该过时补丁，无功能损失；上游刷新补丁后可移除本 workaround。
          if [[ -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch ]]; then
            rm -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch
            echo "Removed obsolete miniupnpd patch 020-descr-filter-fix.patch (merged upstream in miniupnpd 2.3.11)"
          fi

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Import Online Upgrade Package
        # 两套固件都装 luci-app-online-upgrade（升级源按机型在 Custom Settings
        # 里生成，见 Scripts/OnlineUpgradePreset.sh），故本步不按 WRT_MODEM 跳过。
        # 上游是「包即仓库根」形态，且 Build/Prepare、Build/Compile 均为空：
        # 二进制必须由后面的 Cross Compile Online Upgrade Backend 预编译后落到
        # package/luci-app-online-upgrade/root/usr/bin/online-upgrade，否则会装出空壳。
        # 本脚本同时做 CRLF 归一、结构断言与 90-online-upgrade-auto 守卫路径核对。
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages-OnlineUpgrade.sh

      - name: Smoke Test luci-app-mt5700
        # 仅当 WRT_MODEM=MT5700（新插件）时执行；选旧插件时由下一步的
        # luci-app-mt5700m 测试负责。
        # 在耗时编译前，对刚 clone 的 LianXia233/luci-app-mt5700 做结构校验、
        # 语法检查与上游回归测试（用例取自其 .github/workflows/build-openwrt.yml）。
        # 上游改动、脚本语法错误、深度适配注入失效都在这里尽早暴露，而不是
        # 数小时后才在 Compile Firmware 里失败。
        # runner 自带 node / jq / gcc；gettext 已在 Initialization Environment 安装。
        if: env.WRT_MODEM != 'MT5700M'
        run: |
          cd ./wrt/package/luci-app-mt5700

          echo "==> 结构校验（含本仓库深度适配注入）"
          # Scripts/Packages.sh 会做一处注入：src/Makefile 的预编译后端分支。
          # 任一缺失说明克隆或注入失败，编译必然出错。
          # （2026-10-26 起不再注入 mt5700-temp-bridge：风扇插件已换用
          #   LianXia233/luci-app-h5000m-fancontrol，温度桥接由其控制器原生完成。）
          test -f src/Makefile
          test -f src/rust/Cargo.toml
          test -f src/rust/Cargo.lock
          grep -q 'MT5700_PREBUILT_HOOK' src/Makefile
          grep -q 'at-webserver-rust' src/Makefile
          test -x root/etc/init.d/at-webserver
          test -x root/etc/uci-defaults/at-webserver
          test -x root/etc/hotplug.d/iface/99-at-webserver
          test -x root/etc/hotplug.d/usb/99-at-webserver
          test -x root/usr/libexec/at-webserver/on-uplink.sh

          echo "==> Shell 语法检查"
          # tests/iface/interface-selection.sh 需要真机 uci 环境才能跑，这里只查语法
          for SH in \
            root/etc/init.d/at-webserver \
            root/etc/uci-defaults/at-webserver \
            root/etc/hotplug.d/iface/99-at-webserver \
            root/etc/hotplug.d/usb/99-at-webserver \
            root/usr/libexec/at-webserver/on-uplink.sh \
            tests/iface/interface-selection.sh; do
            sh -n "$SH"
          done

          echo "==> LuCI JavaScript 语法检查"
          find htdocs -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          echo "==> 前端解析与 ucode JSON 回归测试"
          for T in \
            apn-channel-test.js \
            ca-status-test.js \
            cellular-icon-test.js \
            parse-regression-test.js \
            pdp-addr-test.js \
            signal-chart-test.js \
            switch-rollback-test.js \
            tabmenu-test.js \
            ucode-json-test.js \
            mock-modem/temp-level-test.js; do
            node "tests/$T"
          done

          echo "==> JSON 元数据校验"
          jq empty root/usr/share/luci/menu.d/luci-app-mt5700.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-mt5700.json

          echo "==> 翻译编译校验"
          # 上游 po 存在重复 msgid（「定时锁频」「运行日志」各两条），
          # msgfmt --check 会判 fatal，但 luci.mk 打包实际用 po2lmo 编译 lmo，
          # 重复项被合并、编译正常。故这里用 feed 里的同一份源码现场构建 po2lmo，
          # 校验口径与真实打包完全一致。
          LUCI_SRC="../../feeds/luci/modules/luci-base/src"
          test -f "$LUCI_SRC/po2lmo.c"
          rm -rf /tmp/po2lmo-src && cp -a "$LUCI_SRC" /tmp/po2lmo-src
          (
            cd /tmp/po2lmo-src
            gcc -O2 -o lemon contrib/lemon.c
            ./lemon -q -l T=contrib/lempar.c lib/plural_formula.y
            gcc -O2 -I. -o /tmp/po2lmo-bin po2lmo.c lib/lmo.c lib/plural_formula.c
          )
          /tmp/po2lmo-bin po/zh_Hans/luci-app-mt5700.po /tmp/luci-app-mt5700.zh_Hans.lmo
          test -s /tmp/luci-app-mt5700.zh_Hans.lmo

          echo "luci-app-mt5700 package smoke test: ALL PASSED"

      - name: Smoke Test luci-app-mt5700m
        # 仅当 WRT_MODEM=MT5700M（旧插件）时执行，检查内容取自其上游
        # .github/workflows/ci.yml：shell 语法与回归测试、原生传输程序编译与
        # 模拟 modem 测试、可执行位、LuCI JS 语法、UI 错误处理与短信解码、
        # menu/acl JSON、翻译文件。
        if: env.WRT_MODEM == 'MT5700M'
        run: |
          cd ./wrt/package/luci-app-mt5700m

          echo "==> Shell 语法检查"
          for SH in \
            luci-app-mt5700m/root/etc/hotplug.d/usb/60-mt5700m \
            luci-app-mt5700m/root/etc/init.d/mt5700m-manager \
            luci-app-mt5700m/root/etc/init.d/mt5700m-traffic \
            luci-app-mt5700m/root/etc/hotplug.d/net/95-mt5700m-traffic \
            luci-app-mt5700m/root/etc/uci-defaults/90-mt5700m \
            luci-app-mt5700m/root/etc/uci-defaults/92-mt5700m-traffic \
            luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m \
            luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m-traffic \
            luci-app-mt5700m/root/usr/sbin/mt5700m-at \
            luci-app-mt5700m/root/usr/sbin/mt5700m-read \
            luci-app-mt5700m/root/usr/sbin/mt5700m-manager \
            luci-app-mt5700m/root/usr/sbin/mt5700m-traffic \
            luci-app-mt5700m/root/usr/share/mt5700m/usb.sh \
            luci-app-mt5700m/root/usr/share/mt5700m/health.sh \
            luci-app-mt5700m/root/usr/share/mt5700m/lock.sh \
            luci-app-mt5700m/root/usr/share/mt5700m/profile.sh; do
            sh -n "$SH"
          done

          echo "==> Shell 回归测试"
          sh luci-app-mt5700m/tests/test-usb-detection.sh
          sh luci-app-mt5700m/tests/test-temperature-cache.sh
          sh luci-app-mt5700m/tests/test-read-cache.sh
          sh luci-app-mt5700m/tests/test-command-contract.sh
          sh luci-app-mt5700m/tests/test-hotplug-debounce.sh
          sh luci-app-mt5700m/tests/test-traffic-interface.sh

          echo "==> 原生传输程序编译与模拟测试"
          gcc -O2 -Wall -Wextra -Werror mt5700m-transport/src/transport.c -o /tmp/mt5700m-transport-test
          TRANSPORT_BIN=/tmp/mt5700m-transport-test python3 mt5700m-transport/tests/test_transport.py -v

          echo "==> 可执行位检查"
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-read
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-traffic
          test -x luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/init.d/mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/hotplug.d/net/95-mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/uci-defaults/92-mt5700m-traffic

          echo "==> LuCI JavaScript 语法检查"
          find luci-app-mt5700m/htdocs -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          echo "==> UI 错误处理与短信解码测试"
          node tests/test-ui-errors.js
          node tests/test-sms-decode.js
          sh tests/test-action-lock.sh
          sh tests/test-sms-jobs.sh
          sh tests/test-health.sh
          sh tests/test-profile-rollback.sh
          node tests/test-sms-ui.js

          echo "==> JSON 元数据校验"
          jq empty luci-app-mt5700m/root/usr/share/luci/menu.d/luci-app-mt5700m.json
          jq empty luci-app-mt5700m/root/usr/share/rpcd/acl.d/luci-app-mt5700m.json

          echo "==> 翻译文件校验"
          msgfmt --check --check-format -o /dev/null luci-app-mt5700m/po/zh_Hans/mt5700m.po

          echo "MT5700M package smoke test: ALL PASSED"

      - name: Smoke Test luci-app-h5000m-fancontrol
        # 仅当 WRT_MODEM != 'MT5700M' 时执行：风扇插件按固件分流，本步只覆盖
        # 新版 LianXia233/luci-app-h5000m-fancontrol（v3.x，Rust 重写版，随
        # MT5700 固件编译）；MT5700M 固件用的是 FAN789 原版（v2.1.1，纯 shell），
        # 其克隆完整性由 Packages.sh 的结构校验覆盖，无独立冒烟步骤。
        # 用例取自新版上游 .github/workflows/ci.yml 中不需要 Rust 工具链的部分：
        # 结构校验（含本仓库注入的预编译分支）、shell 语法、LuCI JS 语法与
        # 浏览器级渲染冒烟、i18n 完整性、JSON 元数据、上游打包红线 /
        # uci-defaults 迁移 / 内核热保护静态检查。
        # Rust 单元测试与交叉编译产物自检在后面 Cross Compile Rust Backends 一步
        # 完成（那里已装好 rustup）。runner 自带 node / jq；gettext 已在
        # Initialization Environment 安装。
        if: env.WRT_MODEM != 'MT5700M'
        run: |
          cd ./wrt/package/luci-app-h5000m-fancontrol

          echo "==> 结构校验（含本仓库深度适配注入）"
          # Scripts/Packages.sh 会做一处注入：src/Makefile 的预编译控制器分支与
          # cargo 缺失告警降级。缺失说明克隆或注入失败，编译必然出错。
          test -f Makefile
          test -f src/Cargo.toml
          test -f src/Cargo.lock
          test -f src/.cargo/config.toml
          grep -q 'H5000M_FANCONTROL_PREBUILT_HOOK' src/Makefile
          grep -q 'warning h5000m-fancontrol: cargo not found' src/Makefile
          test -x root/etc/init.d/h5000m-fancontrol
          test -x root/etc/uci-defaults/91-h5000m-fancontrol-v3
          test -x root/usr/sbin/h5000m-fancontrol-status
          test -f root/etc/config/h5000m_fancontrol
          test -f htdocs/luci-static/resources/view/h5000m/fancontrol.js
          test -f po/zh_Hans/h5000m-fancontrol.po

          echo "==> Shell 语法检查"
          for SH in \
            root/etc/init.d/h5000m-fancontrol \
            root/etc/uci-defaults/91-h5000m-fancontrol-v3 \
            root/usr/sbin/h5000m-fancontrol-status; do
            sh -n "$SH"
          done

          echo "==> LuCI JavaScript 语法与渲染冒烟"
          node --check htdocs/luci-static/resources/view/h5000m/fancontrol.js
          node tests/frontend-smoke.js

          echo "==> i18n 与 JSON 元数据校验"
          node scripts/i18n-audit.js
          msgfmt --check --check-format -o /dev/null po/zh_Hans/h5000m-fancontrol.po
          jq empty root/usr/share/luci/menu.d/luci-app-h5000m-fancontrol.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-h5000m-fancontrol.json

          echo "==> 上游打包红线 / uci-defaults 迁移 / 内核热保护静态检查"
          # test-packaging.sh 断言 src/Makefile 含 aarch64 目标与 FILE_MACHINE_
          # 架构校验：预编译注入保留了这些行，若上游重构 Makefile 会在此失败。
          sh tests/test-packaging.sh
          sh tests/test-uci-defaults.sh
          sh tests/test-kernel-safety.sh

          echo "luci-app-h5000m-fancontrol package smoke test: ALL PASSED"

      - name: Custom Settings
        run: |
          cd ./wrt/

          # MT5700M 模组管理插件：单次构建只追加对应那份插件配置
          # （Config/MT5700.txt = 新插件 luci-app-mt5700；Config/MT5700M.txt = 旧插件
          #  luci-app-mt5700m）。两者独占同一 AT 串口，由调用方矩阵各编一套固件。
          MODEM_CFG="$GITHUB_WORKSPACE/Config/${WRT_MODEM}.txt"
          if [ ! -f "$MODEM_CFG" ]; then
            echo "::error::WRT_MODEM=$WRT_MODEM 没有对应配置，可选 MT5700 / MT5700M（需存在 Config/\$WRT_MODEM.txt）"
            exit 1
          fi
          echo "模组插件配置：$MODEM_CFG"

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt "$MODEM_CFG" >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt "$MODEM_CFG" >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          # 目标设备校验（防止 Profile 静默回退到 DEFAULT_PROFILE）
          # 「Target Profile」是单选 choice：MULTI_PROFILE=n 时生效符号为
          # CONFIG_TARGET_<target>_DEVICE_xxx；若 .config 未正确选中设备，
          # defconfig 会回退到 target.mk 的 DEFAULT_PROFILE（filogic 为
          # openwrt_one），最终编译出错误机型固件，只在镜像打包阶段才暴露
          # （run 40140034404：openwrt_one 缺少 initramfs 导致 target/linux 失败）。
          # 此处提前失败，把数小时的错误编译降级为数分钟内的配置错误。
          DEVICE_SYMBOL=$(grep -oP '^CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_]+(?==y)' \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" | head -1)
          if [ -n "$DEVICE_SYMBOL" ]; then
            if grep -q "^$DEVICE_SYMBOL=y$" .config || \
               grep -q "^CONFIG_TARGET_DEVICE_${DEVICE_SYMBOL#CONFIG_TARGET_}=y$" .config; then
              echo "目标设备已生效: $DEVICE_SYMBOL"
            else
              echo "::error::目标设备 $DEVICE_SYMBOL 未生效，当前 $(grep -m1 '^CONFIG_TARGET_PROFILE=' .config || echo 'CONFIG_TARGET_PROFILE 未设置')"
              exit 1
            fi
          fi

          make defconfig -j$(nproc)

          # 互斥校验：两套 MT5700 插件独占同一 AT 串口，同一份 .config 里
          # 只能有一个主包为 y。这里以 defconfig 之后的最终 .config 为准，
          # 因此无论遗漏在配置文件、还是有人从 WRT_PACKAGE 手工追加，都会被拦下。
          NEW_PLUGIN=$(grep -c '^CONFIG_PACKAGE_luci-app-mt5700=y$' .config || true)
          OLD_PLUGIN=$(grep -c '^CONFIG_PACKAGE_luci-app-mt5700m=y$' .config || true)
          if [ "$NEW_PLUGIN" -gt 0 ] && [ "$OLD_PLUGIN" -gt 0 ]; then
            echo "::error::同一配置同时启用了 luci-app-mt5700 与 luci-app-mt5700m；两者都独占模组 AT 串口，只能二选一"
            exit 1
          fi
          case "$WRT_MODEM" in
            MT5700)  EXPECT_NEW=1; EXPECT_OLD=0 ;;
            MT5700M) EXPECT_NEW=0; EXPECT_OLD=1 ;;
            *)
              echo "::error::WRT_MODEM=$WRT_MODEM 非法，只支持 MT5700 / MT5700M"
              exit 1
              ;;
          esac
          if [ "$NEW_PLUGIN" -ne "$EXPECT_NEW" ] || [ "$OLD_PLUGIN" -ne "$EXPECT_OLD" ]; then
            echo "::error::WRT_MODEM=$WRT_MODEM 期望 ${EXPECT_NEW} 个新插件 / ${EXPECT_OLD} 个旧插件，实际新插件 $NEW_PLUGIN / 旧插件 $OLD_PLUGIN"
            exit 1
          fi
          if [ "$EXPECT_NEW" -eq 1 ]; then
            MODEM_I18N=luci-i18n-mt5700-zh-cn
            MODEM_VER="$MT5700_VERSION"
          else
            MODEM_I18N=luci-i18n-mt5700m-zh-cn
            MODEM_VER="$MT5700M_VERSION"
          fi
          if ! grep -q "^CONFIG_PACKAGE_${MODEM_I18N}=y$" .config; then
            echo "::error::WRT_MODEM=$WRT_MODEM 缺少配套语言包 $MODEM_I18N（主包与语言包必须同批启用）"
            exit 1
          fi
          echo "模组插件已启用：$WRT_MODEM（$MODEM_VER）"
          echo "MT5700_PLUGIN_VERSION=${MODEM_VER}（$WRT_MODEM）" >> "$GITHUB_ENV"

          # 在线升级插件及其运行期依赖：两套固件都要装。依赖由包的 DEPENDS 声明
          # （+rpcd-mod-ucode +ucode-mod-fs +ucode-mod-uci），defconfig 应自动拉齐；
          # 若当前 feeds 缺其中任一包，表现为「主包 =y 但运行期 rpcd 加载失败」，
          # 故在耗时编译前以最终 .config 为准失败。
          for SYM in CONFIG_PACKAGE_luci-app-online-upgrade \
                     CONFIG_PACKAGE_rpcd-mod-ucode \
                     CONFIG_PACKAGE_ucode-mod-fs \
                     CONFIG_PACKAGE_ucode-mod-uci; do
            if ! grep -q "^${SYM}=y$" .config; then
              echo "::error::defconfig 未启用 ${SYM}：在线升级插件或其运行期依赖缺失"
              exit 1
            fi
          done
          echo "在线升级插件已启用：$(grep -m1 '^CONFIG_PACKAGE_luci-app-online-upgrade=' .config)"

          make clean -j$(nproc)

      - name: Rust Cache Key
        # 缓存键覆盖三个 Rust 工程（在线升级后端、at-webserver、风扇控制器）的
        # Cargo.lock 与 rustc 版本：
        #   - 三者的 target 目录都会缓存，任何一个依赖树变化都必须换键，否则会把
        #     按旧依赖编出的产物当成有效缓存；
        #   - 带上 rustc 版本，官方工具链随 stable 滚动时自动失效，避免新旧编译器
        #     产物混在同一个 target 目录里（cargo 虽会按 fingerprint 重编，但白占体积）。
        # 两套固件的源码与目标三元组一致，故键里不含 WRT_MODEM；MT5700M 侧风扇
        # 控制器是纯 shell 版、没有 Cargo.lock，只把存在的 lock 参与哈希即可，
        # registry 与 target 仍可通过 restore-keys 前缀复用。
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/
          LOCK_UP=package/luci-app-online-upgrade/rust/Cargo.lock
          LOCK_AT=package/luci-app-mt5700/src/rust/Cargo.lock
          LOCK_FAN=package/luci-app-h5000m-fancontrol/src/Cargo.lock
          if [ ! -f "$LOCK_UP" ]; then
            echo "::error::$LOCK_UP 不存在（Import Online Upgrade Package 未成功？），无法计算 Rust 缓存键"
            exit 1
          fi
          HASH=$(for f in "$LOCK_UP" "$LOCK_AT" "$LOCK_FAN"; do
            [ -f "$f" ] && { echo "$f"; cat "$f"; }
          done | sha256sum | cut -c1-16)
          REL=$(rustc -vV 2>/dev/null | sed -n 's/^release: //p' | head -1)
          echo "RUST_LOCK_HASH=${HASH}" >> "$GITHUB_ENV"
          echo "RUSTC_REL=${REL:-unknown}" >> "$GITHUB_ENV"
          echo "Rust 缓存键：locks=${HASH} rustc=${REL:-unknown}"

      - name: Rust Build Cache
        # 缓存三份 cargo 副作用，避免每次运行重编依赖树：
        #   registry/git —— crates.io 索引与 .crate 包（at-webserver 131 个依赖、
        #                   online-upgrade 146 个依赖，冷拉取要 30~60 秒）；
        #   *-target     —— 三个 crate 的 release 产物目录，命中后只重编业务代码
        #                   （at-webserver 实测 85 秒，其中绝大部分是依赖树）；
        #   ~/.cache/pip —— ziglang 的 wheel，省掉每次约 50MB 的 PyPI 下载。
        # restore-keys 允许多级降级：依赖树未变但 rustc 升级时仍能复用 registry，
        # target 目录里的过期单元由 cargo 自己的 fingerprint 判定重编。
        if: env.WRT_TEST != 'true'
        id: rust-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            /tmp/h5fan-target
            /tmp/mt5700-target
            /tmp/rust-target-online-upgrade
          key: rust-${{ env.RUST_LOCK_HASH }}-${{ env.RUSTC_REL }}
          restore-keys: |
            rust-${{ env.RUST_LOCK_HASH }}-
            rust-

      - name: Prepare Rust Toolchain
        # 统一准备 Rust 官方工具链与 zig 交叉链接器，供下面两个编译步骤复用。
        # 用 rustup stable + <triple> std，不使用 feeds/packages/lang/rust：
        # OpenWrt 侧 Rust 要现场编译 host LLVM（1~2 小时、约 20GB 磁盘），且产物
        # 链接目标板的 musl 动态库，与本仓库既有的静态 musl 二进制策略不一致
        # （panic 策略、strip 与符号处理也不同）。取舍见 README「Rust 后端编译」。
        # 在线升级插件两套固件都装，故本步不受 WRT_MODEM 限制。
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 预编译产物必须与固件架构一致：架构不符时包能装上、运行时才报
          # Exec format error，故在编译前硬性校验（本固件目标为 Filogic aarch64）。
          ARCH_PACKAGES=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"/\1/p' .config | head -1)
          if [ -z "$ARCH_PACKAGES" ]; then
            echo "::error::.config 未解析出 CONFIG_TARGET_ARCH_PACKAGES，无法确定 Rust 目标架构"
            exit 1
          fi
          case "$ARCH_PACKAGES" in
            aarch64_cortex-a53)
              RUST_TARGET=aarch64-unknown-linux-musl
              ZIG_TARGET=aarch64-linux-musl
              ;;
            *)
              echo "::error::本步骤的预编译只覆盖 aarch64_cortex-a53（H5000M 为 aarch64 Filogic），当前 ARCH_PACKAGES=$ARCH_PACKAGES"
              exit 1
              ;;
          esac
          echo "RUST_TARGET=$RUST_TARGET" >> "$GITHUB_ENV"
          echo "ZIG_TARGET=$ZIG_TARGET" >> "$GITHUB_ENV"
          echo "Rust 目标：$RUST_TARGET（ARCH_PACKAGES=$ARCH_PACKAGES）"

          echo "==> 准备 Rust 官方工具链（rustup stable，优先于发行版/内置 Rust）"
          # 官方 SDK 是唯一编译来源：不用 feeds/packages/lang/rust（要现场编 host
          # LLVM，1~2 小时、约 20GB），也不依赖 runner 预装版本 —— 显式 rustup 安装
          # stable 并固定 RUSTUP_TOOLCHAIN，保证 rustc 版本与缓存键一致。
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            # 先落盘再执行：curl 管道喂 sh 时，curl 挂死或失败会让 sh 读到空内容
            # 并以 0 退出，缺工具链要到几小时后才暴露。
            curl -sSf --retry 3 --connect-timeout 30 --max-time 120 \
              https://sh.rustup.rs -o /tmp/rustup-init.sh
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain stable --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # 工具链与目标 std 一次装齐：分两步会多一轮索引解析与网络往返；
          # 已安装时幂等（只校验不重下）。rustup 无内置下载超时，挂起时收束并重试一次。
          timeout --kill-after=60 900 rustup toolchain install stable --profile minimal \
            --target "$RUST_TARGET" --no-self-update \
            || timeout --kill-after=60 900 rustup toolchain install stable --profile minimal \
                 --target "$RUST_TARGET" --no-self-update
          rustup default stable >/dev/null 2>&1 || true
          # 固定工具链选择，避免项目内 rust-toolchain.toml 把构建切到别的版本
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"
          # cargo 侧的网络与构建参数：sparse 索引比默认 git 索引快一个数量级；
          # 重试/超时与 apt、下载步骤的收束策略一致；release 关闭增量，
          # 让 target 缓存与 fingerprint 行为稳定可复现。
          {
            echo "CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse"
            echo "CARGO_NET_RETRY=5"
            echo "CARGO_HTTP_TIMEOUT=60"
            echo "CARGO_HTTP_MULTIPLEXING=true"
            echo "CARGO_INCREMENTAL=0"
          } >> "$GITHUB_ENV"

          echo "   cargo: $(command -v cargo 2>/dev/null) $(cargo --version 2>/dev/null | awk '{print $2}')"
          echo "   rustc: $(command -v rustc 2>/dev/null) $(rustc -vV 2>/dev/null | sed -n 's/^release: //p')"
          rustup target list --installed | grep -qx "$RUST_TARGET" || {
            echo "::error::官方工具链缺少目标 std：$RUST_TARGET"
            exit 1
          }

          echo "==> 准备 zig 交叉链接器"
          # 用 pip 安装 ziglang（官方 PyPI 发行包），避免 ziglang.org / GitHub Release
          # 两条下载链路都在 CI 上偶发卡住；venv 隔离，不污染 runner 的 Python 环境。
          python3 -m venv /tmp/zig-venv
          # PyPI 链路也可能慢速挂起：pip 自带超时与重试，收束单次下载
          /tmp/zig-venv/bin/pip install --quiet --timeout 60 --retries 3 "ziglang==0.13.0"
          ZIG="$(/tmp/zig-venv/bin/python -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          chmod +x "$ZIG"
          "$ZIG" version
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"

          # cc-rs / cargo 会把 --target= 原样传给被包装的编译器，而 zig 只接受自己的
          # target query；包装脚本统一丢弃外部 --target=、过滤 lld 不认的
          # --fix-cortex-a53-843419，再显式指定 zig target。
          mkdir -p /tmp/zig-wrap
          cat > /tmp/zig-wrap/zig-cc <<'WRAP'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
          	case "$a" in
          		--target=*|*--fix-cortex-a53*) ;;
          		*) args+=("$a") ;;
          	esac
          done
          exec "$ZIG" cc -target "$ZIG_TARGET" "${args[@]}"
          WRAP
          cat > /tmp/zig-wrap/zig-ar <<'WRAP'
          #!/usr/bin/env bash
          args=()
          for a in "$@"; do
          	case "$a" in
          		--target=*) ;;
          		*) args+=("$a") ;;
          	esac
          done
          exec "$ZIG" ar "${args[@]}"
          WRAP
          chmod +x /tmp/zig-wrap/zig-cc /tmp/zig-wrap/zig-ar

      - name: Cross Compile Rust Backends
        # 两个 Rust 后端，均只随 MT5700 固件（新插件）编译：
        # luci-app-h5000m-fancontrol v3.x 的风扇控制器与 luci-app-mt5700 的
        # at-webserver。MT5700M 固件用旧模组插件（原生 C 传输程序）+ FAN789 原版
        # 风扇插件（纯 shell），无需 Rust，本步整体跳过。
        # 工具链与 zig 包装已由 Prepare Rust Toolchain 就绪（RUST_TARGET / ZIG 在 env）。
        #
        # 风扇控制器：零依赖 crate，.cargo/config.toml 已固定 rust-lld，musl 目标
        # 自包含静态链接，不需要 zig 或交叉 gcc。
        # at-webserver：Tokio + rustls 依赖树含 ring（C 代码），链接器用 zig
        # （与上游 scripts/sdk-build.sh 同一方案）：Rust 的 musl target 不自带
        # libc 与启动对象，zig cc 一次提供 libc 与 C 编译器，免装目标板交叉工具链。
        if: env.WRT_TEST != 'true' && env.WRT_MODEM != 'MT5700M'
        env:
          # 与在线升级后端共用同一份 Rust 缓存，命中情况写进计时日志
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          cd ./wrt/

          echo "==> 风扇控制器上游测试（宿主构建）"
          # 上游 CI 的 rust 作业：零依赖 crate，宿主跑全量单测与回归只需一两分钟；
          # 控制器是安全关键组件（PWM / 内核热保护交互），交叉编译前先过测试。
          cd package/luci-app-h5000m-fancontrol/src
          # 零依赖 crate，网络风险仅 crates.io 索引，timeout 收束即可，无需重试
          timeout --kill-after=30 900 cargo test --locked --release

          echo "==> 交叉编译 h5000m-fancontrol（两套固件共用）"
          # 首次构建需下载 musl std 与解析索引，慢速挂起时收束并重试一次
          #（中断只影响未完成的编译单元，重跑从缓存续建）
          FAN_START=$(date +%s)
          CARGO_TARGET_DIR=/tmp/h5fan-target timeout --kill-after=60 1200 \
            cargo build --release --locked --target "$RUST_TARGET" \
            || CARGO_TARGET_DIR=/tmp/h5fan-target timeout --kill-after=60 1200 \
            cargo build --release --locked --target "$RUST_TARGET"
          echo "风扇控制器交叉编译用时：$(( $(date +%s) - FAN_START )) 秒（Rust 缓存命中=${RUST_CACHE_HIT:-false}）"

          echo "==> 产物自检"
          FAN_BIN="/tmp/h5fan-target/$RUST_TARGET/release/h5000m-fancontrol"
          file "$FAN_BIN"
          file "$FAN_BIN" | grep -q 'ARM aarch64' || { echo "::error::风扇控制器不是 aarch64 ELF"; exit 1; }
          file "$FAN_BIN" | grep -q 'statically linked' || { echo "::error::风扇控制器不是静态链接"; exit 1; }
          readelf -d "$FAN_BIN" | grep -q 'no dynamic section' || {
            echo "::error::风扇控制器带动态段，固件缺少对应 musl 动态库时无法启动"
            readelf -d "$FAN_BIN"
            exit 1
          }
          # 零依赖 + opt-level=z + strip 后体积远小于 at-webserver，闸门只拦
          # 「产物被截断 / 构建未完成」，不设兆级下限。
          FAN_SIZE=$(stat -c %s "$FAN_BIN")
          if [ "$FAN_SIZE" -lt 65536 ]; then
            echo "::error::风扇控制器体积异常（$FAN_SIZE 字节），疑似构建未完成"
            exit 1
          fi

          mkdir -p prebuilt
          cp -f "$FAN_BIN" prebuilt/h5000m-fancontrol
          chmod 0755 prebuilt/h5000m-fancontrol
          ls -l prebuilt/
          echo "luci-app-h5000m-fancontrol 预编译控制器就绪：$FAN_SIZE 字节"
          cd "$GITHUB_WORKSPACE/wrt"

          echo "==> 交叉编译 at-webserver"
          cd package/luci-app-mt5700/src/rust
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-wrap/zig-cc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_AR=/tmp/zig-wrap/zig-ar
          export CC_aarch64_unknown_linux_musl=/tmp/zig-wrap/zig-cc
          export AR_aarch64_unknown_linux_musl=/tmp/zig-wrap/zig-ar
          export RUSTFLAGS="-C link-self-contained=no"
          # --locked：Cargo.lock 由上游固定，避免 CI 上解析出与发布产物不同的依赖树。
          # Tokio + rustls + ring 依赖树的下载与 zig 链接最重，挂起时收束并重试一次
          AT_START=$(date +%s)
          CARGO_TARGET_DIR=/tmp/mt5700-target timeout --kill-after=60 1800 \
            cargo build --release --locked --target "$RUST_TARGET" \
            || CARGO_TARGET_DIR=/tmp/mt5700-target timeout --kill-after=60 1800 \
            cargo build --release --locked --target "$RUST_TARGET"
          echo "at-webserver 交叉编译用时：$(( $(date +%s) - AT_START )) 秒（Rust 缓存命中=${RUST_CACHE_HIT:-false}）"

          echo "==> 产物自检"
          BIN="/tmp/mt5700-target/$RUST_TARGET/release/at-webserver"
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' || { echo "::error::后端不是 aarch64 ELF"; exit 1; }
          file "$BIN" | grep -q 'statically linked' || { echo "::error::后端不是静态链接"; exit 1; }
          readelf -d "$BIN" | grep -q 'no dynamic section' || {
            echo "::error::后端带动态段，固件缺少对应 musl 动态库时无法启动"
            readelf -d "$BIN"
            exit 1
          }
          BIN_SIZE=$(stat -c %s "$BIN")
          if [ "$BIN_SIZE" -lt 1000000 ]; then
            echo "::error::后端体积异常（$BIN_SIZE 字节），疑似构建未完成"
            exit 1
          fi

          mkdir -p ../prebuilt
          cp -f "$BIN" ../prebuilt/at-webserver
          chmod 0755 ../prebuilt/at-webserver
          ls -l ../prebuilt/
          echo "luci-app-mt5700 预编译后端就绪：$BIN_SIZE 字节"

      - name: Cross Compile Online Upgrade Backend
        # luci-app-online-upgrade 上游 Build/Prepare 与 Build/Compile 均为空，
        # buildroot 不会为它编译 Rust；二进制必须在这里预编译后落到包内安装路径
        # package/luci-app-online-upgrade/root/usr/bin/online-upgrade
        # （Makefile 的 INSTALL_BIN 来源），否则会装出没有后端的空壳。
        # 两套固件都装该插件，故本步不按 WRT_MODEM 跳过。
        #
        # 工具链是 Rust 官方 stable（非 OpenWrt SDK rust），交叉链接由 zig cc
        # 提供 musl libc 与启动对象（该依赖树含 ring 的 C 代码）。
        # -C target-cpu=cortex-a53 与固件 ARCH_PACKAGES=aarch64_cortex-a53 对齐
        # （OpenWrt 官方软件包同样以 cortex-a53 为基线）；不使用 native：runner 是
        # x86_64，native 会把宿主机指令集编进 aarch64 产物，跨架构直接不可用。
        if: env.WRT_TEST != 'true'
        env:
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          cd ./wrt/package/luci-app-online-upgrade/rust

          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/tmp/zig-wrap/zig-cc
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_AR=/tmp/zig-wrap/zig-ar
          export CC_aarch64_unknown_linux_musl=/tmp/zig-wrap/zig-cc
          export AR_aarch64_unknown_linux_musl=/tmp/zig-wrap/zig-ar
          export RUSTFLAGS="-C link-self-contained=no -C target-cpu=cortex-a53"

          echo "==> 交叉编译 online-upgrade（target=$RUST_TARGET，缓存命中=${RUST_CACHE_HIT:-false}）"
          # --locked：Cargo.lock 由上游固定，避免 CI 解析出与发布产物不同的依赖树。
          # strip 由上游 [profile.release] strip=true 在链接后执行，这里不再二次处理。
          START=$(date +%s)
          CARGO_TARGET_DIR=/tmp/rust-target-online-upgrade timeout --kill-after=60 1800 \
            cargo build --release --locked --target "$RUST_TARGET" \
            || CARGO_TARGET_DIR=/tmp/rust-target-online-upgrade timeout --kill-after=60 1800 \
            cargo build --release --locked --target "$RUST_TARGET"
          END=$(date +%s)
          echo "在线升级后端交叉编译用时：$((END - START)) 秒（缓存命中=${RUST_CACHE_HIT:-false}）"

          echo "==> 产物自检"
          BIN="/tmp/rust-target-online-upgrade/$RUST_TARGET/release/online-upgrade"
          file "$BIN"
          file "$BIN" | grep -q 'ARM aarch64' || { echo "::error::online-upgrade 不是 aarch64 ELF"; exit 1; }
          file "$BIN" | grep -q 'statically linked' || { echo "::error::online-upgrade 不是静态链接"; exit 1; }
          readelf -d "$BIN" | grep -q 'no dynamic section' || {
            echo "::error::online-upgrade 带动态段，固件缺少对应 musl 动态库时无法启动"
            readelf -d "$BIN"
            exit 1
          }
          BIN_SIZE=$(stat -c %s "$BIN")
          # Tokio + rustls + ring 依赖树，opt-level=z + lto + strip 后仍应有兆级体积；
          # 闸门只拦「产物被截断 / 构建未完成」。
          if [ "$BIN_SIZE" -lt 500000 ]; then
            echo "::error::online-upgrade 体积异常（$BIN_SIZE 字节），疑似构建未完成"
            exit 1
          fi

          mkdir -p ../root/usr/bin
          cp -f "$BIN" ../root/usr/bin/online-upgrade
          chmod 0755 ../root/usr/bin/online-upgrade
          ls -l ../root/usr/bin/
          echo "luci-app-online-upgrade 预编译后端就绪：$BIN_SIZE 字节"

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 2026-11-07 事故：源码包镜像「连上但吞吐趋零」，本步拖了 77 分钟
          # （正常 ~2 分钟）直至 runner 被环境回收、日志未上传。download.pl 的
          # 镜像轮换只在连接失败时触发，慢速挂起必须用 timeout 强制收束
          # （timeout 自建进程组，信号能命中 make 拉起的全部下载子进程）。
          # 源码包先落 tmp/dl、校验哈希通过才进 dl/，中断不留损坏文件，
          # 降级重试只补缺失部分，失败即快速报错并保留日志。
          if ! timeout --kill-after=60 900 make download -j$(nproc); then
            echo "==> 并发下载超时或失败，降级 -j1 逐文件重试（轮换镜像源）"
            timeout --kill-after=60 1800 make download -j1 V=s
          fi

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # 2026-11-09 run 130 复盘：Cache-Clean 在周日删掉全部缓存，两个作业都从零开始，
          # 首轮 90 分钟在 toolchain/gcc/final（MT5700M 还卡在 tools/llvm-bpf 的 clang 编译）
          # 被 SIGTERM；降级命令 `make -j1 V=s` 把 4 核并行改成单线程，又空烧 120 分钟
          # 仍停在同一处，最终 step 以 124 退出。冷编译实测需要 4 小时以上，旧的双重超时
          # （90 + 120 分钟）与 300 分钟 job 上限都不可能完成；而 -j1 不是「续编」而是
          # 把剩余工作放大数倍，正是第二轮毫无进展的原因。
          #
          # 改为「自适应总预算 + 等长分片续编」：
          #   - 每个分片 45 分钟，始终 -j$(nproc)：超时只中断当前分片，不是整轮构建；
          #   - make 幂等，分片之间从断点继续，损失仅为被 SIGTERM 打断的个别编译单元；
          #   - 总预算上限 300 分钟（冷编译实测的量级），并从前置步骤耗时中扣除，
          #     保证 job 总时长不超过 360 分钟上限（留 10 分钟给打包与发布）；
          #   - 冷编译成功后新缓存会被写回，后续运行回到 40 分钟量级；
          #   - 源码包按需下载挂起同样被单个分片的 timeout 收束，下一分片重新轮换镜像，
          #     不会像以前那样一次挂起就吃掉整轮预算。
          JOB_CAP=21000   # 350 分钟：360 分钟 job 上限减 10 分钟给后续步骤
          MAX_BUDGET=18000 # 300 分钟：冷编译预算上限
          if [ -n "${JOB_START_EPOCH:-}" ]; then
            elapsed=$(( $(date +%s) - JOB_START_EPOCH ))
          else
            elapsed=900
          fi
          budget=$(( JOB_CAP - elapsed ))
          if [ "$budget" -lt 3600 ]; then
            echo "::error::job 已耗时 $((elapsed / 60)) 分钟，剩余预算不足 60 分钟，无法完成编译"
            exit 1
          fi
          if [ "$budget" -gt "$MAX_BUDGET" ]; then budget=$MAX_BUDGET; fi
          echo "==> 编译预算 $((budget / 60)) 分钟（job 已耗时 $((elapsed / 60)) 分钟）"
          DEADLINE=$(( $(date +%s) + budget ))
          CHUNK=2700
          attempt=0
          fast_fail=0
          while :; do
            attempt=$((attempt + 1))
            remain=$(( DEADLINE - $(date +%s) ))
            if [ "$remain" -le 60 ]; then
              echo "::error::固件编译用尽 ${budget} 秒总预算仍未完成（已尝试 ${attempt} 次）"
              echo "::error::最近 10 分钟内的编译产物（便于定位卡点）："
              find . -name '*.built' -newermt '-10 minutes' 2>/dev/null | head -5 || true
              exit 1
            fi
            slice=$CHUNK
            if [ "$remain" -lt "$slice" ]; then slice=$remain; fi
            echo "==> 编译分片 #${attempt}：${slice}s，剩余预算 $((remain / 60)) 分钟，-j$(nproc)"
            if timeout --kill-after=60 "$slice" make -j$(nproc); then
              echo "==> 固件编译完成（分片 #${attempt}）"
              break
            else
              rc=$?
              # 124/137：本次分片被 timeout 收束（挂起或单纯没编完），从断点续编是有效的。
              # 其他退出码是 make 自己报错（源码/补丁/链接失败），续编会瞬间复现，
              # 连续两次即判为真实编译错误终止，避免在剩余预算里空转。
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                fast_fail=0
                echo "==> 分片 #${attempt} 超时（退出码 ${rc}），从断点续编"
              else
                fast_fail=$((fast_fail + 1))
                echo "==> 分片 #${attempt} 失败（退出码 ${rc}），从断点续编（连续非超时失败 ${fast_fail} 次）"
                if [ "$fast_fail" -ge 2 ]; then
                  echo "::error::连续 ${fast_fail} 次非超时失败（退出码 ${rc}），判定为真实编译错误，终止"
                  exit 1
                fi
              fi
            fi
          done

          # make 返回 0 不足以保证产物存在（例如配置裁剪掉了镜像目标），这里显式核对。
          if ! find bin/targets -type f \
            \( -name '*.bin' -o -name '*.img' -o -name '*.itb' -o -name '*.squashfs' \) \
            2>/dev/null | grep -q .; then
            echo "::error::make 成功但 bin/targets 下没有固件镜像"
            find bin/targets -maxdepth 3 -type f 2>/dev/null | head -20 || true
            exit 1
          fi

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_MODEM"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_MODEM"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            # 过滤非固件小文件：mediatek 目标编译时会把 mt798x-ram-*-bl2 等
            # DDR 引导辅助 bin（<1MB，仅供开发者二次拼包，不可直接刷写）输出到
            # bin/targets，上面的兜底搬运会把它带进 upload。真正的固件 bin 都是
            # 几十 MB 的 sysupgrade / factory / kernel 镜像，按「.bin 且小于 2MB
            # 即非固件」过滤，Release 页面只保留正常固件与 Config / manifest
            # 等文本辅助文件。-print 把被删文件记进日志，便于事后核对。
            find ./upload/ -type f -iname "*.bin" -size -2M -print -delete

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        # node24：softprops/action-gh-release@v2 运行在 Node 20 上
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_MODEM}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            Hiveton H5000M (MT5700M) 定制固件 · 基于 ImmortalWrt

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            模组插件：${{env.WRT_MODEM}}（MT5700 = luci-app-mt5700 / MT5700M = luci-app-mt5700m）
            每日构建会分别产出两套固件，两套插件独占同一 AT 串口，请按需下载其中一套。

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI 名称：${{env.WRT_SSID}}
            WIFI 密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            MT5700M 插件版本：${{env.MT5700_PLUGIN_VERSION}}
            风扇插件版本：${{env.H5000M_FANCONTROL_VERSION}}
