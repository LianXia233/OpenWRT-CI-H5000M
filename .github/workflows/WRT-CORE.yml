# 云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    # 固定 runner 镜像：ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26.04，
    # 而 immortalwrt 初始化脚本与部分 host 依赖尚未适配，迁移会造成编译中断。
    # 固定到 ubuntu-24.04 保证可复现构建（需更新镜像时只需改这一处）。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Projects
        # node24：actions/checkout@v4 仍运行在已弃用的 Node 20 上
        uses: actions/checkout@v7

      - name: Free Up Disk Space
        # GitHub ubuntu-latest runner 根盘预装 dotnet/android-sdk/ghc 等占用约 25GB，
        # filogic 全量编译 + ccache 需要 30GB 以上，先清理与编译无关的预装件。
        # 这些目录不影响 apt 与构建工具链，runner 为一次性环境，删除安全。
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            /usr/lib/google-cloud-sdk /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h / /mnt 2>/dev/null || true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # apt 全局超时配置：覆盖本步骤及 init_build_environment.sh 内部 apt 调用，
          # 避免偶发网络挂起导致 job 6 小时超时取消
          sudo tee /etc/apt/apt.conf.d/99marvis-timeouts >/dev/null <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          Acquire::ftp::Timeout "60";
          DPkg::Lock::Timeout "120";
          Dpkg::Use-Pty "0";
          EOF
          # apt 命令超时重试封装
          # 用法：apt_retry <超时秒数> <apt 子命令及参数...>
          # 不同命令耗时差异很大（full-upgrade 在 runner 镜像更新后可能要下载数百 MB），
          # 统一 300 秒会把正常的慢速下载误杀，故超时时间改为按命令传入。
          apt_retry() {
            local tmo="$1"; shift
            local i
            for i in 1 2 3; do
              timeout --kill-after=30 "$tmo" sudo -E apt -yqq \
                -o Dpkg::Options::=--force-confdef \
                -o Dpkg::Options::=--force-confold "$@" && return 0
              echo "apt $* 第 ${i} 次失败或超时（${tmo}s），10 秒后重试" >&2
              sleep 10
            done
            return 1
          }
          apt_retry 300 purge firefox
          apt_retry 300 update
          # 主机系统升级不是编译必需项：慢网络下允许更长耗时，失败也不阻塞后续流程，
          # 只需修复可能被中断的 dpkg 状态即可。
          if ! apt_retry 1800 full-upgrade; then
            echo "系统升级失败或超时，修复 dpkg 状态后继续" >&2
            sudo -E dpkg --configure -a || true
            sudo -E apt -yqq -f install || true
          fi
          apt_retry 300 autoremove --purge
          apt_retry 300 autoclean
          apt_retry 300 clean
          apt_retry 900 install dos2unix libfuse-dev gettext
          # 官方初始化脚本同样加超时与重试（脚本内部有 apt update 步骤）
          INIT_OK=0
          for i in 1 2 3; do
            timeout --kill-after=30 1800 sudo bash -c 'bash <(curl -sL --retry 3 --connect-timeout 30 https://build-scripts.immortalwrt.org/init_build_environment.sh)' && { INIT_OK=1; break; }
            echo "init_build_environment 第 ${i} 次失败或超时，10 秒后重试" >&2
            sleep 10
          done
          if [ "$INIT_OK" != "1" ]; then
            echo "init_build_environment 连续失败，终止以避免后续编译无谓耗时" >&2
            exit 1
          fi
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        # node24：actions/cache@v4 仍运行在已弃用的 Node 20 上
        uses: actions/cache@v6
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if [ "${{ steps.check-cache.outputs.cache-hit }}" != 'true' ]; then
            CACHE_LIST=$(gh cache list --json id --key "$WRT_CONFIG-$WRT_INFO" --jq '.[].id' 2>/dev/null)
            for CACHE_ID in $CACHE_LIST; do
              gh cache delete "$CACHE_ID"
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2026-10-17 修复：immortalwrt/packages 合并官方源（dd29469e22）后
          # miniupnpd 升级到 2.3.11，feed 自带的 020-descr-filter-fix.patch
          # 针对的是旧版解析器，其全部改动（upnppermissions.c 解析器重写、
          # upnppermissions.h 的 const char * 签名）已被 2.3.11 上游吸收，
          # 继续打补丁会因 7 个 hunk 中 5 个失败而中断所有平台的编译。
          # 删除该过时补丁，无功能损失；上游刷新补丁后可移除本 workaround。
          if [[ -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch ]]; then
            rm -f feeds/packages/net/miniupnpd/patches/020-descr-filter-fix.patch
            echo "Removed obsolete miniupnpd patch 020-descr-filter-fix.patch (merged upstream in miniupnpd 2.3.11)"
          fi

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Smoke Test MT5700M Package
        # 在耗时编译前，对刚 clone 的 FAN789/luci-app-mt5700m 执行其上游
        # .github/workflows/ci.yml 同款静态检查与回归测试。上游引入语法错误、
        # 编译破坏或行为回归时在此尽早失败，避免数小时后才在 Compile Firmware
        # 暴露。ubuntu-latest 自带 gcc / python3 / node / jq；msgfmt 依赖
        # gettext（已在 Initialization Environment 安装）。
        run: |
          cd ./wrt/package/luci-app-mt5700m

          echo "==> Shell 语法检查"
          for SH in \
            luci-app-mt5700m/root/etc/hotplug.d/usb/60-mt5700m \
            luci-app-mt5700m/root/etc/init.d/mt5700m-manager \
            luci-app-mt5700m/root/etc/init.d/mt5700m-traffic \
            luci-app-mt5700m/root/etc/hotplug.d/net/95-mt5700m-traffic \
            luci-app-mt5700m/root/etc/uci-defaults/90-mt5700m \
            luci-app-mt5700m/root/etc/uci-defaults/92-mt5700m-traffic \
            luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m \
            luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m-traffic \
            luci-app-mt5700m/root/usr/sbin/mt5700m-at \
            luci-app-mt5700m/root/usr/sbin/mt5700m-read \
            luci-app-mt5700m/root/usr/sbin/mt5700m-manager \
            luci-app-mt5700m/root/usr/sbin/mt5700m-traffic \
            luci-app-mt5700m/root/usr/share/mt5700m/usb.sh \
            luci-app-mt5700m/root/usr/share/mt5700m/health.sh \
            luci-app-mt5700m/root/usr/share/mt5700m/lock.sh \
            luci-app-mt5700m/root/usr/share/mt5700m/profile.sh; do
            sh -n "$SH"
          done

          echo "==> Shell 回归测试"
          sh luci-app-mt5700m/tests/test-usb-detection.sh
          sh luci-app-mt5700m/tests/test-temperature-cache.sh
          sh luci-app-mt5700m/tests/test-read-cache.sh
          sh luci-app-mt5700m/tests/test-command-contract.sh
          sh luci-app-mt5700m/tests/test-hotplug-debounce.sh
          sh luci-app-mt5700m/tests/test-traffic-interface.sh

          echo "==> 原生传输程序编译与模拟测试"
          gcc -O2 -Wall -Wextra -Werror mt5700m-transport/src/transport.c -o /tmp/mt5700m-transport-test
          TRANSPORT_BIN=/tmp/mt5700m-transport-test python3 mt5700m-transport/tests/test_transport.py -v

          echo "==> 可执行位检查"
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-read
          test -x luci-app-mt5700m/root/usr/sbin/mt5700m-traffic
          test -x luci-app-mt5700m/root/usr/libexec/rpcd/mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/init.d/mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/hotplug.d/net/95-mt5700m-traffic
          test -x luci-app-mt5700m/root/etc/uci-defaults/92-mt5700m-traffic

          echo "==> LuCI JavaScript 语法检查"
          find luci-app-mt5700m/htdocs -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          echo "==> UI 错误处理与短信解码测试"
          node tests/test-ui-errors.js
          node tests/test-sms-decode.js
          sh tests/test-action-lock.sh
          sh tests/test-sms-jobs.sh
          sh tests/test-health.sh
          sh tests/test-profile-rollback.sh
          node tests/test-sms-ui.js

          echo "==> JSON 元数据校验"
          jq empty luci-app-mt5700m/root/usr/share/luci/menu.d/luci-app-mt5700m.json
          jq empty luci-app-mt5700m/root/usr/share/rpcd/acl.d/luci-app-mt5700m.json

          echo "==> 翻译文件校验"
          msgfmt --check --check-format -o /dev/null luci-app-mt5700m/po/zh_Hans/mt5700m.po

          echo "MT5700M package smoke test: ALL PASSED"

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          # 目标设备校验（防止 Profile 静默回退到 DEFAULT_PROFILE）
          # 「Target Profile」是单选 choice：MULTI_PROFILE=n 时生效符号为
          # CONFIG_TARGET_<target>_DEVICE_xxx；若 .config 未正确选中设备，
          # defconfig 会回退到 target.mk 的 DEFAULT_PROFILE（filogic 为
          # openwrt_one），最终编译出错误机型固件，只在镜像打包阶段才暴露
          # （run 40140034404：openwrt_one 缺少 initramfs 导致 target/linux 失败）。
          # 此处提前失败，把数小时的错误编译降级为数分钟内的配置错误。
          DEVICE_SYMBOL=$(grep -oP '^CONFIG_TARGET_[A-Za-z0-9_]+_DEVICE_[A-Za-z0-9_]+(?==y)' \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" | head -1)
          if [ -n "$DEVICE_SYMBOL" ]; then
            if grep -q "^$DEVICE_SYMBOL=y$" .config || \
               grep -q "^CONFIG_TARGET_DEVICE_${DEVICE_SYMBOL#CONFIG_TARGET_}=y$" .config; then
              echo "目标设备已生效: $DEVICE_SYMBOL"
            else
              echo "::error::目标设备 $DEVICE_SYMBOL 未生效，当前 $(grep -m1 '^CONFIG_TARGET_PROFILE=' .config || echo 'CONFIG_TARGET_PROFILE 未设置')"
              exit 1
            fi
          fi

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        if: env.WRT_TEST != 'true'
        # node24：softprops/action-gh-release@v2 运行在 Node 20 上
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            Hiveton H5000M (MT5700M) 定制固件 · 基于 ImmortalWrt

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI 名称：${{env.WRT_SSID}}
            WIFI 密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

            MT5700M 插件版本：${{env.MT5700M_VERSION}}
